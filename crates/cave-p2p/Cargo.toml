[package]
name = "cave-p2p"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Decentralized P2P AI agent network plugin for bkg-cave"
repository = "https://github.com/1bitshit/bkg-cave"

[features]
default = ["local-inference"]
dynamic = ["dep:libloading"]
local-inference = [
  "dep:candle-core",
  "dep:candle-nn",
  "dep:candle-transformers",
  "dep:hf-hub",
  "dep:tokenizers",
  "dep:llama-cpp-2",
  "dep:llama-cpp-sys-2",
]
metal = []
cuda = []

[dependencies]
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap.workspace = true
sha2.workspace = true
hex.workspace = true
tempfile.workspace = true

# P2P networking
libp2p = { version = "0.54", features = [
  "tokio",
  "noise",
  "tcp",
  "quic",
  "mdns",
  "kad",
  "gossipsub",
  "request-response",
  "json",
  "identify",
  "macros",
  "serde",
  "yamux",
] }
libp2p-identity = "0.2"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"

# Web
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors", "fs", "normalize-path"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }

# Serialization
rmp-serde = "1"

# Utilities
lru = "0.12"
rustyline = "14"
dotenvy = "0.15"
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
blake3 = "1"
rand = "0.8"
num_cpus = "1"
sysinfo = "0.31"
parking_lot = "0.12"
bs58 = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
time = "0.3.36"
dirs = "5"
base64 = "0.22"
flate2 = "1"
regex = "1"
serde_yaml = "0.9"
which = "7"
url = "2"
cron = "0.13"
cel = { version = "0.13", default-features = false, features = ["json", "regex", "chrono"] }

# Database
redb = "2"

# WASM
wasmtime = { version = "28", features = ["component-model"] }
wasmtime-wasi = "28"

# Inference (optional)
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
hf-hub = { version = "0.3", optional = true }
tokenizers = { version = "0.20", optional = true }
llama-cpp-2 = { version = "0.1", optional = true }
llama-cpp-sys-2 = { version = "0.1", optional = true }

# Dynamic loading
libloading = { version = "0.8", optional = true }

# Local crate
cave-core = { path = "../../crates/cave-core" }
