[workspace]
members = [
  "crates/cave-core",
  "crates/cave-surge",
  "crates/cave-kindle",
  "crates/cave-forge",
  "crates/cave",
  "crates/cave-p2p",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
